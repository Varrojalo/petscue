<title>Petscue Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Schibsted+Grotesk:wght@500;700;800;900&display=swap">
<style>
:root{
  --bg:#F5F8F4; --surface:#FFFFFF; --surface-2:#EAF1EA; --line:#D6E0D8;
  --ink:#22303F; --ink-2:#4D5B6B; --ink-3:#6B7A8A;
  --brand:#2F7D5A; --accent:#F2C94C; --on-brand:#FFFFFF; --on-accent:#22303F;
  --brand-soft:color-mix(in oklab,var(--brand) 14%,var(--surface));
  --brand-text:color-mix(in oklab,var(--brand) 88%,var(--ink));
  --accent-soft:color-mix(in oklab,var(--accent) 32%,var(--surface));
  --ok:#1C7A43; --ok-soft:#E1F2E7; --warn:#8A5300; --warn-soft:#FCEFD7; --bad:#B0281F; --bad-soft:#FBE4E1; --info:#2F5F82; --info-soft:#E2ECF5;
  --shadow:0 1px 2px rgb(34 48 63/.06),0 18px 36px -22px rgb(34 48 63/.4);
  --disp:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --sticky-top:env(safe-area-inset-top,0px);
  --mk-bg:#141B22; --mk-2:#243039; --mk-ink:#ECF0F2; --mk-mute:#98A6B2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111A22; --surface:#18232E; --surface-2:#20303C; --line:#2C3C49;
    --ink:#E4EBF0; --ink-2:#AAB8C4; --ink-3:#8594A3;
    --brand-soft:color-mix(in oklab,var(--brand) 24%,var(--surface));
    --brand-text:color-mix(in oklab,var(--brand) 45%,#FFFFFF);
    --accent-soft:color-mix(in oklab,var(--accent) 20%,var(--surface));
    --ok:#6CD497; --ok-soft:#15301F; --warn:#F2B75E; --warn-soft:#33260F; --bad:#FF8F85; --bad-soft:#3A1917; --info:#8CC0E6; --info-soft:#15283A;
    --shadow:0 1px 2px rgb(0 0 0/.3),0 18px 36px -22px rgb(0 0 0/.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111A22; --surface:#18232E; --surface-2:#20303C; --line:#2C3C49;
  --ink:#E4EBF0; --ink-2:#AAB8C4; --ink-3:#8594A3;
  --brand-soft:color-mix(in oklab,var(--brand) 24%,var(--surface));
  --brand-text:color-mix(in oklab,var(--brand) 45%,#FFFFFF);
  --accent-soft:color-mix(in oklab,var(--accent) 20%,var(--surface));
  --ok:#6CD497; --ok-soft:#15301F; --warn:#F2B75E; --warn-soft:#33260F; --bad:#FF8F85; --bad-soft:#3A1917; --info:#8CC0E6; --info-soft:#15283A;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 18px 36px -22px rgb(0 0 0/.8);
}
html{font-size:17px}
html.big{font-size:19.5px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,.display{font-family:var(--disp);text-wrap:balance;line-height:1.05;letter-spacing:-.02em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.2em;height:1.2em;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Mockup bar ---------- */
.mk{background:var(--mk-bg);color:var(--mk-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px;font-size:14px}
.mk-id{display:flex;align-items:baseline;gap:10px}
.mk-id b{font-family:var(--disp);font-size:1.05rem}
.mk-id span{font-size:.8rem;color:var(--mk-mute)}
.mk-ctrls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:var(--mk-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mk-mute);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--mk-ink);color:var(--mk-bg)}
@media (max-width:640px){.seg-device{display:none}}

/* ---------- Stage ---------- */
.stage.phone{padding:24px 16px;background:var(--surface-2)}
.device{position:relative}
.stage.phone .device{width:min(390px,100%);height:min(820px,calc(100vh - 110px));min-height:560px;margin-inline:auto;border:10px solid #141B22;border-radius:46px;overflow:hidden;transform:translateZ(0);box-shadow:0 30px 60px -30px rgb(0 0 0/.5);background:var(--bg)}
.app{container:app / inline-size;display:flex;flex-direction:column;min-height:calc(100vh - 56px);background:var(--bg)}
.stage.phone .app{height:100%;min-height:0;overflow-y:auto;scrollbar-width:none;--sticky-top:0px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:var(--sticky-top);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:left}
.logo{width:42px;height:42px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;font:900 1.15rem var(--disp);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.org{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.org b{font-family:var(--disp);font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org small{font-size:.74rem;color:var(--ink-3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav{display:none;gap:2px}
.nav button{border:0;background:none;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font:800 .95rem var(--disp);color:var(--ink-2);flex:none}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.roletag{display:none;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
@container app (min-width:560px){.roletag{display:inline-block}}

/* ---------- Tabs ---------- */
.tabs{position:sticky;bottom:0;z-index:30;margin-top:auto;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;justify-content:center;font-size:.74rem;font-weight:700;color:var(--ink-3);position:relative}
.tabs .pill{display:grid;place-items:center;width:54px;height:32px;border-radius:999px;transition:background .2s}
.tabs button[aria-current="page"]{color:var(--brand-text)}
.tabs button[aria-current="page"] .pill{background:var(--brand-soft)}
.count{position:absolute;top:4px;left:calc(50% + 10px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center}
.side .count{position:static;margin-left:auto}

/* ---------- Layout ---------- */
.main{width:100%;max-width:1160px;margin-inline:auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:36px;flex:1;min-width:0}
.admin-body{display:flex;flex:1;width:100%}
.admin-body .main{gap:24px}
.side{display:none}
@container app (min-width:800px){
  .nav{display:flex}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:240px;flex:none;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:calc(var(--sticky-top) + 64px);align-self:flex-start}
  .side button{border:0;background:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left}
  .side button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
  .main{padding:28px 32px 56px}
  .only-mobile{display:none!important}
}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{font-size:clamp(2rem,7cqi,2.9rem);font-weight:900}
.page-head p{margin-top:8px;max-width:58ch}
.sec-title{font-size:1.6rem;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 0;font-weight:700;color:var(--brand-text);align-self:flex-start}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:18px;border:0;font:800 1rem/1.2 var(--disp);letter-spacing:-.005em;text-align:center;transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn .ar{transition:transform .25s}
.btn:hover .ar{transform:translateX(4px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover:not(:disabled){box-shadow:0 12px 22px -12px var(--brand)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn-light{background:#fff;color:#22303F}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 16px;font-size:.92rem;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--brand-text);font-weight:700;padding:8px 0;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:.95rem}
.field small,.help{color:var(--ink-3);font-size:.84rem}
.input{width:100%;min-height:54px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:1rem}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.form{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;gap:16px}
@container app (min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-weight:700}
.err:empty{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:24px;height:24px;accent-color:var(--brand);flex:none;margin-top:1px}

/* ---------- Photos (placeholders until each org uploads its own) ---------- */
.ph{position:relative;overflow:hidden;display:block;background:
  radial-gradient(circle at 36% 44%,var(--f1) 0 15%,transparent 33%),
  radial-gradient(ellipse at 38% 66%,var(--f2) 0 19%,transparent 40%),
  radial-gradient(circle at 80% 16%,rgb(255 246 214/.9) 0 6%,transparent 24%),
  linear-gradient(165deg,var(--a),var(--b) 58%,var(--c))}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 32% 42%,transparent 38%,rgb(0 0 0/.2))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ph .cap{position:absolute;z-index:2;right:10px;top:10px;display:inline-flex;align-items:center;gap:5px;font:700 .62rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:rgb(255 255 255/.85);color:#22303F}
.ph .cap .ic{width:12px;height:12px}
.ph.has-img .cap,.ph.has-img::after{display:none}

/* ---------- Public home ---------- */
.home-hero{display:grid;gap:22px}
@container app (min-width:800px){.home-hero{grid-template-columns:1.05fr 1fr;align-items:center;gap:40px}}
.feature{position:relative;display:block;width:100%;height:clamp(420px,120cqi,560px);border-radius:32px;overflow:hidden;border:0;padding:0;text-align:left;color:#fff;box-shadow:var(--shadow)}
@container app (min-width:800px){.feature{height:560px}}
.feature .ph{position:absolute;inset:0;transition:transform 7s ease-out}
.feature:hover .ph{transform:scale(1.07)}
.shade{position:absolute;inset:auto 0 0 0;height:66%;z-index:2;background:linear-gradient(transparent,rgb(12 18 26/.86))}
.fcopy{position:absolute;left:20px;right:20px;bottom:20px;z-index:3;display:flex;flex-direction:column;gap:10px}
.fcopy small{font:700 .74rem var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.fcopy .name{font:900 clamp(3.4rem,18cqi,5.2rem)/.88 var(--disp);letter-spacing:-.045em}
.u{position:relative;display:inline-block}
.u svg{position:absolute;left:-3%;bottom:-.14em;width:106%;height:.3em;overflow:visible;pointer-events:none}
.u path{stroke:var(--accent);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:0;transition:stroke-dashoffset 1s cubic-bezier(.3,.7,.2,1)}
.fcopy p{font-size:1rem;max-width:36ch;opacity:.95}
.fcopy .go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:4px;padding:10px 16px;border-radius:14px;background:#fff;color:#22303F;font:800 .95rem var(--disp)}
.hero-side{display:flex;flex-direction:column;gap:16px}
.hero-side h1{font-size:clamp(2.2rem,8cqi,3.4rem);font-weight:900}
.hero-side .lede{font-size:1.1rem;color:var(--ink-2);max-width:44ch}
.stats{display:flex;gap:22px;flex-wrap:wrap;padding-top:6px}
.stats div{display:flex;flex-direction:column}
.stats b{font:900 1.9rem/1 var(--disp);color:var(--brand-text);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stats span{font-size:.84rem;color:var(--ink-2)}
.fan-wrap{display:grid;gap:18px}
@container app (min-width:800px){.fan-wrap{grid-template-columns:1fr 1.2fr;align-items:center}}
.fan{position:relative;height:clamp(250px,72cqi,330px);max-width:460px;width:100%;justify-self:center}
.fcard{position:absolute;top:0;width:54%;background:var(--surface);padding:8px 8px 12px;border-radius:22px;box-shadow:var(--shadow);transition:transform .55s cubic-bezier(.3,1.4,.4,1);border:0;text-align:left;color:var(--ink)}
.fcard .ph{aspect-ratio:1;border-radius:16px}
.fcard .ph .cap{display:none}
.fcard b{display:block;font:800 1.08rem var(--disp);padding:8px 4px 0}
.fcard small{display:block;font-size:.8rem;color:var(--ink-3);padding:0 4px}
.fcard.c0{left:0;transform:rotate(-7deg) translate(6px,16px)}
.fcard.c1{left:23%;z-index:2;transform:rotate(1deg)}
.fcard.c2{right:0;transform:rotate(8deg) translate(-6px,22px)}
.fan:hover .c0,.fan:focus-within .c0{transform:rotate(-11deg) translate(-12px,8px)}
.fan:hover .c2,.fan:focus-within .c2{transform:rotate(12deg) translate(12px,14px)}
.fan:hover .c1,.fan:focus-within .c1{transform:translateY(-10px)}
.ways{display:grid;gap:12px}
@container app (min-width:700px){.ways{grid-template-columns:1fr 1fr}}
.way{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .2s,transform .2s;color:var(--ink)}
.way:hover{border-color:var(--brand);transform:translateX(3px)}
.way .bub{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.way.y .bub{background:var(--accent-soft);color:var(--ink)}
.way .bub .ic{width:26px;height:26px}
.way b{display:block;font:800 1.12rem var(--disp)}
.way small{display:block;color:var(--ink-2);font-size:.9rem}
.way .arr{margin-left:auto;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
@container app (min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.steps li::before{content:counter(s);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font:900 1rem var(--disp)}
.steps b{font:800 1.1rem var(--disp)}
.steps p{color:var(--ink-2);font-size:.94rem}
.fee{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:20px;background:var(--accent-soft)}
.fee b{font:900 1.4rem var(--disp);font-variant-numeric:tabular-nums}
.fee p{max-width:60ch;font-size:.95rem}
.foot{border-top:1px solid var(--line);padding:26px 16px 30px;display:grid;gap:14px;max-width:1160px;width:100%;margin-inline:auto;color:var(--ink-2)}
.foot b.n{font:800 1.2rem var(--disp);color:var(--ink)}
.foot .cols{display:grid;gap:12px}
@container app (min-width:700px){.foot .cols{grid-template-columns:repeat(3,1fr)}}
.foot .sel{user-select:all;color:var(--ink)}
.foot .made{font-size:.8rem;color:var(--ink-3)}

/* ---------- Animal cards ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container app (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pet{display:flex;flex-direction:column;gap:10px;padding:0;border:0;background:none;text-align:left;color:var(--ink)}
.pet .ph{aspect-ratio:4/5;border-radius:24px;transition:transform .35s cubic-bezier(.3,1.4,.4,1),box-shadow .35s}
.pet:hover .ph{transform:translateY(-4px) rotate(-1deg);box-shadow:var(--shadow)}
.pet .ph .cap{right:auto;left:10px;top:auto;bottom:10px}
.pet-name{font:900 1.45rem/1 var(--disp);letter-spacing:-.03em;padding-inline:4px}
.pet-meta{font-size:.9rem;color:var(--ink-2);padding-inline:4px;margin-top:-6px}
.tagpill{position:absolute;z-index:3;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--body);padding:5px 10px;border-radius:999px}
.tagpill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-acogida{background:var(--accent);color:var(--on-accent)}
.t-tratamiento{background:var(--info-soft);color:var(--info)}
.t-disponible{background:var(--ok-soft);color:var(--ok)}
.t-adoptado,.t-fallecido,.t-trasladado{background:var(--surface-2);color:var(--ink-2)}
.filters{display:flex;flex-direction:column;gap:12px}
.filters .selects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@container app (min-width:800px){.filters{flex-direction:row;align-items:center;justify-content:space-between}.filters .selects{width:440px}}
.empty{padding:40px 20px;text-align:center;border:2px dashed var(--line);border-radius:22px;color:var(--ink-2)}

/* ---------- Animal page ---------- */
.ficha{display:grid;gap:0}
@container app (min-width:860px){.ficha{grid-template-columns:1fr 1fr;gap:40px;align-items:start}}
.ficha-photo{position:relative;height:clamp(360px,105cqi,440px);border-radius:32px;overflow:hidden}
.ficha-photo .ph{position:absolute;inset:0}
@container app (min-width:860px){.ficha-photo{height:620px;position:sticky;top:calc(var(--sticky-top) + 84px)}}
.ficha-photo .backbtn{position:absolute;z-index:3;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:14px;border:0;background:rgb(255 255 255/.92);color:#22303F;font-weight:700}

/* ---------- Color helpers ---------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
function lum(h){return hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function onColor(h){return contrast(h,'#FFFFFF')>=contrast(h,'#22303F')?'#FFFFFF':'#22303F'}
function crInfo(c){const r=contrast(c,onColor(c));const t=r>=4.5?['good','Se lee bien']:r>=3?['mid','Solo sirve para textos grandes']:['poor','Difícil de leer, elige otro tono'];return `<span class="cr ${t[0]}">Contraste ${r.toFixed(1)}:1 · ${t[1]}</span>`}

/* ---------- RUT (módulo 11) ---------- */
function dvOf(body){let s=0,m=2;for(let i=body.length-1;i>=0;i--){s+=+body[i]*m;m=m===7?2:m+1}const r=11-(s%11);return r===11?'0':r===10?'K':String(r)}
const fmtRut=b=>b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dvOf(b);
function parseRut(str){
  const c=String(str||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(c.length<8||c.length>9)return{ok:false,msg:'Escribe el RUT completo con su dígito verificador, por ejemplo 12.345.678-5.'};
  const body=c.slice(0,-1),dv=c.slice(-1);
  if(!/^\d{7,8}$/.test(body))return{ok:false,msg:'El RUT solo lleva números y un dígito verificador (0–9 o K).'};
  if(dvOf(body)!==dv)return{ok:false,msg:`El dígito verificador no coincide. Para ${body.replace(/\B(?=(\d{3})+(?!\d))/g,'.')} debería ser ${dvOf(body)}.`};
  return{ok:true,body,fmt:fmtRut(body)};
}

    <section class="home-hero">
      <button class="feature" data-go="ficha" data-id="${f.id}">${photo(f)}<span class="shade"></span>

      <div class="hero-side">

        <p class="lede">Tenemos ${v.length} perros y gatos listos para ir a casa. Conócelos, súmate como socio o recibe a uno en tu casa mientras encuentra familia.</p>

        <div class="stats"><div><b>${S.org.adoptions2026}</b><span>adopciones este año</span></div><div><b>${S.org.members}</b><span>socios nos apoyan</span></div></div>
      </div>
    </section>
    <section class="fan-wrap">
      <div class="stack"><h2 class="sec-title">También buscan casa</h2><p class="muted">Toca a cualquiera para conocer su historia.</p><div><button class="link" data-go="adoptar">Ver todos ${ic('arrow')}</button></div></div>
      <div class="fan" tabindex="0" aria-label="Otros animales">${others.map((a,i)=>`<button class="fcard c${i}" data-go="ficha" data-id="${a.id}">${photo(a)}<b>${esc(a.name)}</b><small>${esc(a.age)}</small></button>`).join('')}</div>

        <button class="way" data-act="help" data-type="voluntario"><span class="bub">${ic('hand')}</span><span><b>Hazte voluntario</b><small>Aporta tu tiempo en el refugio y las ferias. Los voluntarios también pueden ser casa de acogida</small></span><span class="arr">${ic('arrow')}</span></button>
      </div>
    </section>
    <section class="stack">
      <h2 class="sec-title">Cómo es adoptar</h2>

        <li><b>Elige</b><p>Mira las fichas y encuentra a tu compañero.</p></li>

  adoptar(){
    const f=S.filter;
    const list=visible().filter(a=>(f.species==='todos'||a.species===f.species)&&(f.size==='todos'||a.size===f.size)&&(f.age==='todos'||a.ageGroup===f.age));
    const opt=(v,l,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`;
    return `
    <div class="page-head"><div><h1>Buscan familia</h1><p class="muted">Toca a cualquiera para conocer su historia y pedir la adopción.</p></div></div>
    <div class="filters">
      <div class="chips" role="group" aria-label="Especie">${[['todos','Todos'],...S.species.filter(s=>s.active).map(s=>[s.id,s.plural])].map(([v,l])=>`<button class="chip" data-act="f-species" data-v="${v}" aria-pressed="${f.species===v}">${l}</button>`).join('')}</div>
      <div class="selects">
        <select class="input" id="f-size" data-change="f-size" aria-label="Tamaño">${opt('todos','Cualquier tamaño',f.size)}${['Pequeño','Mediano','Grande'].map(s=>opt(s,s,f.size)).join('')}</select>
        <select class="input" id="f-age" data-change="f-age" aria-label="Edad">${opt('todos','Cualquier edad',f.age)}${[['cachorro','Cachorro'],['joven','Joven'],['adulto','Adulto'],['senior','Mayor']].map(([v,l])=>opt(v,l,f.age)).join('')}</select>
      </div>
    </div>
    <p class="small muted" aria-live="polite">${list.length} ${list.length===1?'animal':'animales'}</p>
    ${list.length?`<div class="grid">${list.map(petCard).join('')}</div>`:`<div class="empty"><p><b>No hay animales con esos filtros.</b></p><p>Prueba con “Cualquier tamaño” o “Cualquier edad”.</p><p><button class="link" data-act="f-reset">Quitar filtros</button></p></div>`}`;
  },
  ficha(){
    const a=animal(S.pub.id);

    return `
    <article class="ficha">
      <div class="ficha-photo">${photo(a)}<button class="backbtn" data-act="back">${ic('back')} Volver</button></div>

        ${a.status==='acogida'?`<span class="status-pill t-acogida">En casa de acogida · disponible</span>`:a.status==='tratamiento'?`<span class="status-pill t-tratamiento">En tratamiento</span>`:`<span class="status-pill t-disponible">Disponible</span>`}

        <p class="quote">“${esc(a.quote)}”</p>
        <p>${esc(a.story)}</p>
        <div class="traits">${a.traits.map(t=>`<span class="trait">${esc(t)}</span>`).join('')}</div>

        <div class="field"><span>¿Dónde vives?</span><div class="chips">${['Departamento','Casa','Casa con patio'].map((v,i)=>`<label class="chip"><input type="radio" name="home" value="${v}" ${i===0?'checked':''}>${v}</label>`).join('')}</div></div>

        ${S.org.fee>0?`<p class="note">La adopción tiene un aporte de <b>${clp(S.org.fee)}</b>, que se paga directamente a la fundación al firmar el contrato. Ayuda a cuidar al resto de los animales.</p>`:''}

  ayudar(){

    const sp=h.animalId?animal(h.animalId):null;
    const AV=['Días de semana','Fines de semana','Ferias de adopción','Traslados en auto'];
    return `<div class="narrow">
      <div class="page-head"><div><h1>Súmate a ${esc(S.org.name)}</h1><p class="muted">Aquí solo dejas tu solicitud. El equipo te contactará para conocerte, y los aportes se coordinan directamente con la fundación.</p></div></div>
      <form class="form" data-form="help" novalidate>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-weight:700;margin-bottom:8px">¿Cómo quieres ayudar? Puedes elegir las dos.</legend>
          <div class="opts">
            <label class="opt"><input type="checkbox" name="socio" data-change="help-socio" ${h.socio?'checked':''}><span class="bub">${ic('heart')}</span><span><b>Como socio</b><small>Aportas recursos: una cuota mensual para la fundación o el padrinazgo de un animal.</small></span></label>

          </div>
        </fieldset>
        ${h.socio?`<div class="field"><span>¿Cómo quieres aportar?</span><div class="chips"><label class="chip"><input type="radio" name="mode" value="aporte" data-change="help-mode" ${h.mode==='aporte'?'checked':''}>A la fundación</label><label class="chip"><input type="radio" name="mode" value="padrino" data-change="help-mode" ${h.mode==='padrino'?'checked':''}>Apadrinando a un animal</label></div></div>
          ${h.mode==='aporte'?`<div class="field"><span>Aporte mensual</span><div class="tiers">${S.org.cuotas.map(c=>`<label class="tier"><input type="radio" name="amount" value="${c}" ${h.amount===c?'checked':''}><b>${clp(c)}</b><small>al mes</small></label>`).join('')}</div><small>El monto es referencial. Si prefieres otro, cuéntanoslo en la conversación.</small></div>`
          :`<label class="field"><span>¿A quién quieres apadrinar?</span><select class="input" id="h-animal" name="animalId" data-change="help-animal"><option value="">Elige un animal</option>${v.map(a=>`<option value="${a.id}" ${h.animalId===a.id?'selected':''}>${esc(a.name)} · ${clp(a.sponsor)} al mes</option>`).join('')}</select>${sp?`<small>El padrinazgo de ${esc(sp.name)} es de ${clp(sp.sponsor)} al mes y cubre su alimento.</small>`:''}</label>`}`:''}

        <div class="row2"><label class="field"><span>Nombre y apellidos</span><input class="input" id="h-name" name="name" autocomplete="name"></label>

        <div class="row2"><label class="field"><span>Teléfono</span><input class="input" id="h-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+56 9 1234 5678"></label>
        <label class="field"><span>Correo <small>(opcional)</small></span><input class="input" id="h-email" name="email" type="email" autocomplete="email"></label></div>
        <label class="check"><input type="checkbox" id="h-ok" name="ok"><span>Acepto que ${esc(S.org.name)} guarde mis datos para gestionar mi solicitud.</span></label>

  avisar(){
    const r=S.report;
    return `<div class="narrow">
      <div class="page-head"><div><h1>Avisar de un animal en la calle</h1><p class="muted">Envíanos una foto y dónde está. El equipo recibirá el aviso en su teléfono.</p></div></div>

        <label class="field"><span>Tu teléfono <small>(opcional)</small></span><input class="input" id="rp-phone" name="phone" type="tel" inputmode="tel" placeholder="+56 9 1234 5678"></label>

        <button class="btn btn-primary btn-block" type="submit">Enviar aviso</button>

  gracias(){
    const k=S.pub.kind;
    const msg={
      adopt:['¡Solicitud enviada!',`Gracias por querer adoptar a ${esc(S.pub.name||'')}. Te llamaremos en los próximos días para conocerte y coordinar una visita.`],

function feeBox(){
  const f=S.org.fee;
  return `<div class="fee"><p>${f>0?`La adopción tiene un aporte de <b>${clp(f)}</b>. Se paga a la fundación al firmar el contrato y ayuda a cuidar al resto de los animales.`:'Adoptar no tiene costo. Nuestro trabajo se financia con el aporte de los socios.'}</p>${f>0?`<b>${clp(f)}</b>`:''}</div>`;
}

const toISO=s=>{const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(String(s||'').trim());return m?`${m[3]}-${m[2]}-${m[1]}`:null};

function newAnimal(o){
  const id=Math.max(...S.animals.map(a=>a.id))+1,sx=(o.sex||'Hembra').toLowerCase();
  return {id,name:o.name,species:o.species,sex:sx==='macho'?'Macho':sx==='desconocido'?'Desconocido':'Hembra',age:'Por confirmar',ageGroup:'adulto',size:'Mediano',tone:id%TONES.length,since:o.since,status:o.status,visits:0,featured:false,sponsor:6000,vacc:false,ster:false,chip:false,traits:[],quote:'Pronto contaremos más sobre este animal.',story:'Importado desde Excel.',returns:o.returns||[],foster:null};
}

    check:r=>{const c=parseRut(r[0]);if(!c.ok)return 'RUT no válido. '+c.msg;if(!r[1])return 'Falta el nombre de quien adoptó.';if(!r[2])return 'Falta el nombre del animal.';if(!specByName(r[3]))return badSpecies(r[3]);if(!toISO(r[4]))return 'Falta la fecha del contrato o no está como día-mes-año (15-03-2024).';if(r[5]&&!toISO(r[5]))return 'La fecha de devolución no está como día-mes-año.';if(r[5]&&toISO(r[5])<toISO(r[4]))return 'La devolución es anterior al contrato.';return null},

    check:r=>{const c=parseRut(r[0]);if(!c.ok)return 'RUT no válido. '+c.msg;if(restrictionFor(c.body))return 'Esta persona ya está en la lista.';if(!r[2])return 'Falta el motivo.';if(r[3].toLowerCase()!=='todas'&&!specByName(r[3]))return badSpecies(r[3]);return null},
    apply:r=>{const c=parseRut(r[0]);S.restrictions.push({body:c.body,name:r[1],reason:r[2],species:r[3].toLowerCase()==='todas'?'todas':specByName(r[3]).id,note:'Importado desde Excel.',date:'2026-09-30',by:'Marta González'})},
    unit:['persona','personas'],see:['rut','Ver la lista de restricciones']}
};
// All or nothing: the import only runs when the template matches and every row is valid.
const WRONG_COLS=['Nombre','Teléfono','Dirección','Observaciones'];
function importRows(def){const all=def.rows();return (S.imp.sample==='ok'?all.filter(r=>!def.check(r)):all).map(r=>({r,err:def.check(r)}))}
function runImport(){
  const def=IMPORTS[S.imp.kind];if(S.imp.sample==='wrong')return;
  const rows=importRows(def);if(rows.some(x=>x.err))return;
  rows.forEach(x=>def.apply(x.r));
  S.imports.unshift({kind:S.imp.kind,file:S.imp.file,ok:rows.length,when:'Hoy',by:'Marta González'});
  S.imp.done={ok:rows.length};S.imp.loaded=false;render(true);
}

const isAdmin=()=>S.role==='admin';
function rutCheck(body,species){
  const r=restrictionFor(body);
  if(!r)return{level:'ok',html:`<span class="flag ok">${ic('check')} Sin restricciones</span>`};
  const applies=r.species==='todas'||r.species===species;
  if(applies)return{level:'bad',html:`<span class="flag bad">${ic('shield')} Restringido · ${esc(r.reason)} · ${restrictionLabel(r)}</span>`};
  return{level:'info',html:`<span class="flag info">${ic('info')} Tiene una restricción solo para ${esc(spec(r.species).plural.toLowerCase())}: puede adoptar este animal</span>`};
}

        ${isAdmin()?'':`<div class="lock">${ic('lock')}<span>Puedes consultar la lista y ver los motivos. Para añadir o quitar a alguien, habla con la administración.</span></div>`}
        ${isAdmin()&&S.rAdd?`<form class="form" data-form="restriction" novalidate>
          <div class="row2"><label class="field"><span>RUT</span><input class="input" id="rs-rut" name="rut" placeholder="12.345.678-5"></label><label class="field"><span>Nombre</span><input class="input" id="rs-name" name="name"></label></div>
          <div class="row2"><label class="field"><span>Motivo</span><select class="input" id="rs-reason" name="reason"><option>Maltrato</option><option>Abandono</option><option>Devolución reiterada</option><option>Datos falsos en la solicitud</option><option>Otro</option></select></label>
          <label class="field"><span>Aplica a</span><select class="input" id="rs-species" name="species"><option value="todas">Todas las especies</option>${S.species.filter(s=>s.active).map(s=>`<option value="${s.id}">Solo ${esc(s.plural.toLowerCase())}</option>`).join('')}</select></label></div>
          <label class="field"><span>Notas internas</span><textarea class="input" id="rs-note" name="note" rows="2" placeholder="Qué pasó y cuándo"></textarea></label>
          <p class="err" id="rs-err" role="alert"></p><button class="btn btn-primary" type="submit">Guardar en la lista</button></form>`:''}
        <div class="list">${rows||'<p class="muted">La lista está vacía.</p>'}</div>
      </section>
    </div>`;
  },
  avisos(){
    return `
    <div class="page-head"><div><h1>Avisos de la calle <span class="beta" style="vertical-align:middle">En evaluación</span></h1><p class="muted">Llegan desde la web con foto y dirección. El equipo recibe una notificación en el teléfono.</p></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${S.reports.map(r=>`
      <article class="panel" style="padding:14px;gap:10px">${r.photo?`<span class="ph rph has-img"><img src="${r.photo}" alt="Foto del aviso ${r.code}"></span>`:photo({name:'animal del aviso',tone:r.tone},'rph')}
        <div class="row" style="justify-content:space-between"><b class="rut">${r.code}</b><span class="small muted">${r.when}</span></div>
        <b>${ic('pin')} ${esc(r.address)}</b>${r.note?`<p class="muted small">${esc(r.note)}</p>`:''}<p class="small">${esc(r.contact)}</p>
        ${r.status==='nuevo'?`<button class="btn btn-primary btn-sm" data-act="report-done" data-id="${r.id}">Marcar como atendido</button>`:`<span class="flag ok">${ic('check')} Atendido</span>`}
      </article>`).join('')}</div>`;
  },
  apariencia(){
    if(!isAdmin())return `<div class="page-head"><div><h1>Apariencia</h1></div></div><div class="lock">${ic('lock')}<span>Solo la administración puede cambiar la identidad de la web. Cambia a “Administración” en la barra superior del mockup para verlo.</span></div>`;
    const o=S.org,f=featuredAnimal();
    return `
    <div class="page-head"><div><h1>Apariencia y datos</h1><p class="muted">La estructura de la web es la de Petscue. Aquí pones lo que es propio de tu fundación, y los cambios se ven al momento.</p></div></div>
    <div class="split">
      <form class="form" data-form="org" novalidate>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Identidad</h2>
          <div class="logo-edit"><span class="logo">${logoMark()}</span><label class="btn btn-ghost btn-sm" for="org-logo">${ic('camera')} ${o.logo?'Cambiar logo':'Subir logo'}</label><input type="file" accept="image/*" id="org-logo" class="sr-only">${o.logo?`<button type="button" class="btn btn-ghost btn-sm" data-act="logo-rm">Quitar</button>`:''}</div>
          <div class="row2"><label class="field"><span>Nombre</span><input class="input" id="org-name" data-org="name" value="${esc(o.name)}"></label><label class="field"><span>Ciudad</span><input class="input" id="org-city" data-org="city" value="${esc(o.city)}"></label></div>
        </section>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Colores institucionales</h2>
          <div class="presets">${PRESETS.map(p=>`<button type="button" class="preset" data-act="preset" data-v="${p.name}" aria-pressed="${p.brand.toLowerCase()===o.brand.toLowerCase()&&p.accent.toLowerCase()===o.accent.toLowerCase()}"><span class="sw"><i style="background:${p.brand}"></i><i style="background:${p.accent}"></i></span>${p.name}</button>`).join('')}</div>
          <div class="field"><span>Color principal</span><small>Botones, menús y enlaces</small><div class="color-row"><input type="color" id="c-brand" data-color="brand" value="${o.brand.toLowerCase()}" aria-label="Color principal"><div><input class="input" id="c-brand-hex" data-hex="brand" value="${o.brand.toUpperCase()}" maxlength="7" aria-label="Código del color principal"><div id="cr-brand">${crInfo(o.brand)}</div></div></div></div>
          <div class="field"><span>Color de acento</span><small>Destacados, subrayado y apadrinar</small><div class="color-row"><input type="color" id="c-accent" data-color="accent" value="${o.accent.toLowerCase()}" aria-label="Color de acento"><div><input class="input" id="c-accent-hex" data-hex="accent" value="${o.accent.toUpperCase()}" maxlength="7" aria-label="Código del color de acento"><div id="cr-accent">${crInfo(o.accent)}</div></div></div></div>
        </section>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Tipografía de títulos</h2>
          <p class="muted small">Los textos largos siempre usan Atkinson Hyperlegible para que se lean bien.</p>
          <div class="row"><span class="flag ${o.font?'info':'ok'}">${ic('type')} ${o.font?`Usando: ${esc(o.fontName)}`:'Usando la de Petscue (Schibsted Grotesk)'}</span></div>
          <div class="row"><label class="btn btn-ghost btn-sm" for="org-font">Subir tipografía (.woff2, .ttf, .otf)</label><input type="file" accept=".woff2,.woff,.ttf,.otf" id="org-font" class="sr-only">${o.font?`<button type="button" class="btn btn-ghost btn-sm" data-act="font-rm">Volver a la de Petscue</button>`:''}</div>
        </section>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Adopción y aportes</h2>
          <label class="field"><span>Aporte de adopción</span><input class="input" id="org-fee" name="fee" type="number" min="0" step="1000" inputmode="numeric" value="${o.fee}"><small>Pon 0 si adoptar no tiene costo. La web lo explicará sola.</small></label>
          <div class="field"><span>Cuotas de socio sugeridas</span><div class="row2" style="grid-template-columns:repeat(3,1fr)">${o.cuotas.map((c,i)=>`<input class="input" id="org-c${i}" name="c${i}" type="number" min="0" step="1000" inputmode="numeric" value="${c}" aria-label="Cuota ${i+1}">`).join('')}</div></div>
        </section>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Redes sociales</h2>
          <p class="muted small">Escribe solo el nombre de usuario. Deja vacías las que no uses: no aparecerán en la web. WhatsApp usa el teléfono de contacto.</p>
          <div class="row2">${SOCIAL.map(([k,l])=>`<label class="field"><span>${l}</span><input class="input" id="org-${k}" name="s_${k}" value="${esc(o.social[k])}" placeholder="fundacionpatitas"></label>`).join('')}</div>
        </section>
        <section class="panel">
          <h2 style="font-size:1.25rem;font-weight:800">Contacto</h2>
          <label class="field"><span>Dirección</span><input class="input" id="org-address" name="address" value="${esc(o.address)}"></label>
          <div class="row2"><label class="field"><span>Teléfono</span><input class="input" id="org-phone" name="phone" value="${esc(o.phone)}"></label><label class="field"><span>Correo</span><input class="input" id="org-email" name="email" value="${esc(o.email)}"></label></div>
        </section>
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
      </form>
      <section class="stack" style="position:sticky;top:90px"><p class="eyebrow">Vista previa</p>
        <div class="pv"><div class="pv-hero">${photo(f)}<span class="shade"></span><span class="fcopy"><small>Busca familia</small><span class="name"><span class="u">${esc(f.name)}${underline()}</span></span></span></div>
          <div class="pv-bot"><span class="btn btn-primary btn-sm">Quiero adoptarlo</span><span class="btn btn-accent btn-sm">Apadrinar</span><span class="tagpill t-acogida" style="position:static">En casa de acogida</span></div></div>
        <button class="btn btn-ghost" data-act="to-public">${ic('eye')} Ver la web pública</button>
        <section class="panel" id="especies">
          <div class="panel-head"><div><h2>Especies que rescatan</h2><p>Aparecen en los filtros de la web, en las fichas y en la lista de restricciones.</p></div></div>
          <div class="list">${S.species.map(s=>{const n=S.animals.filter(a=>a.species===s.id).length;return `<div class="bl-row"><div><b>${esc(s.plural)}</b><br><span class="small muted">${n} ${n===1?'animal':'animales'}${s.active?'':' · oculta en la web'}</span></div><button class="btn btn-ghost btn-sm" data-act="sp-toggle" data-v="${s.id}">${s.active?'Ocultar':'Mostrar'}</button></div>`}).join('')}</div>
          <form class="form" data-form="species" novalidate>
            <div class="row2"><label class="field"><span>Nueva especie</span><input class="input" id="sp-name" name="name" placeholder="Ej.: Conejo"></label><label class="field"><span>En plural</span><input class="input" id="sp-plural" name="plural" placeholder="Ej.: Conejos"></label></div>
            <p class="err" id="sp-err" role="alert"></p>
            <button class="btn btn-ghost btn-sm" type="submit" style="align-self:flex-start">${ic('plus')} Añadir especie</button>
          </form>
          <p class="help">Una especie con animales no se borra: se oculta y su historial se conserva.</p>
        </section>
      </section>
    </div>`;
  },
  personas(){
    if(!isAdmin())return `<div class="page-head"><div><h1>Personas</h1></div></div><div class="lock">${ic('lock')}<span>Solo la administración puede ver al equipo y gestionar los accesos al panel. Cambia a “Administración” en la barra superior del mockup para verlo.</span></div>`;
    const f=S.pFilter;
    const match={todas:()=>true,acceso:p=>p.access,voluntarios:p=>p.voluntario,acogida:p=>p.acogida,socios:p=>p.socio,planta:p=>p.staff==='planta'}[f];
    const list=S.people.filter(match);
    const cnt=k=>S.people.filter({acceso:p=>p.access,voluntarios:p=>p.voluntario,acogida:p=>p.acogida,socios:p=>p.socio,planta:p=>p.staff==='planta'}[k]).length;
    const fostering=p=>S.animals.filter(a=>a.foster&&a.foster.personId===p.id&&a.status==='acogida');
    const me=1;
    const row=p=>{
      const fa=fostering(p);
      const tags=[p.staff==='planta'?'<span class="tg staff">Equipo de planta</span>':'',p.voluntario?'<span class="tg vol">Voluntario</span>':'',p.acogida?'<span class="tg aco">Casa de acogida</span>':'',p.socio?`<span class="tg soc">${esc(socioLabel(p.socio))}</span>`:''].join('');
      const access=p.access?`Acceso al panel: <b>${p.access==='admin'?'Administración':'Trabajador'}</b>`:'Sin acceso al panel';
      let acts='';
      if(S.pConfirm===p.id)acts=`<span class="confirm" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700">¿Quitar el acceso de ${esc(firstName(p.name))}? <button class="btn btn-primary btn-sm" data-act="p-revoke-yes" data-id="${p.id}">Sí, quitar acceso</button><button class="btn btn-ghost btn-sm" data-act="p-revoke-no">No</button></span>`;
      else{
        if(p.access&&p.id!==me)acts+=`<button class="btn btn-ghost btn-sm" data-act="p-revoke" data-id="${p.id}">${ic('lock')} Revocar acceso</button>`;
        if(!p.access&&(p.staff||p.voluntario))acts+=`<button class="btn btn-ghost btn-sm" data-act="p-grant" data-id="${p.id}">Dar acceso</button>`;
        if(p.voluntario||p.staff)acts+=p.acogida?(fa.length?`<span class="small muted">Cuida a ${fa.map(a=>esc(a.name)).join(', ')}</span>`:`<button class="btn btn-ghost btn-sm" data-act="p-foster" data-id="${p.id}">Quitar de casas de acogida</button>`):`<button class="btn btn-ghost btn-sm" data-act="p-foster" data-id="${p.id}">${ic('house')} Hacer casa de acogida</button>`;
        if(p.id===me)acts+='<span class="small muted">Eres tú</span>';
      }
      return `<div class="arow"><span class="person-bub">${esc(p.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span>
        <div class="arow-main"><strong>${esc(p.name)}</strong><span class="meta"><span class="rut">${fmtRut(p.body)}</span><span>Desde ${MONTHS[new Date(p.since+'T12:00:00').getMonth()]} ${p.since.slice(0,4)}</span></span><span class="tags">${tags}</span><span class="small muted">${access}</span></div>
        <div class="arow-side">${acts}</div></div>`;
    };
    return `
    <div class="page-head"><div><h1>Personas</h1><p class="muted">Quienes sostienen la fundación: el equipo de planta, los voluntarios y los socios. Aquí también decides quién puede entrar al panel.</p></div></div>
    <div class="relation">
      <div><b>${ic('heart')} Socios · aportan recursos</b>Con una cuota mensual para la fundación o apadrinando a un animal.</div>
      <div><b>${ic('hand')} Equipo · aporta su tiempo</b>Voluntarios (sin vínculo laboral) y equipo de planta. Las casas de acogida siempre salen del equipo. Cualquiera puede además ser socio.</div>
    </div>
    <div class="chips">${[['todas','Todas'],['acceso',`Con acceso (${cnt('acceso')})`],['planta',`Planta (${cnt('planta')})`],['voluntarios',`Voluntarios (${cnt('voluntarios')})`],['acogida',`Casas de acogida (${cnt('acogida')})`],['socios',`Socios (${cnt('socios')})`]].map(([v,l])=>`<button class="chip" data-act="p-filter" data-v="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</div>
    <section class="panel"><div class="list">${list.map(row).join('')||'<p class="muted">No hay personas en este grupo.</p>'}</div></section>`;
  },
  importar(){
    if(!isAdmin())return `<div class="page-head"><div><h1>Importar desde Excel</h1></div></div><div class="lock">${ic('lock')}<span>Solo la administración puede importar información.</span></div>`;
    const k=S.imp.kind,def=IMPORTS[k];
    const hist=`<section class="panel"><div class="panel-head"><div><h2>Importaciones anteriores</h2></div></div><div class="list">${S.imports.map(h=>`<div class="bl-row"><div><b>${IMPORTS[h.kind].label}</b><br><span class="small muted">${esc(h.file)} · ${h.when} · ${esc(h.by)}</span></div><span class="small"><b>${h.ok}</b> filas importadas</span></div>`).join('')}</div></section>`;
    if(S.imp.done){const d=S.imp.done;return `
      <div class="narrow"><div class="done"><span class="big">${ic('check')}</span><h1>Se importaron ${d.ok} ${d.ok===1?def.unit[0]:def.unit[1]}</h1>
        <p>Todas las filas de la planilla pasaron la revisión y quedaron guardadas.</p>
        <div class="row" style="justify-content:center"><button class="btn btn-primary" data-go="${def.see[0]}">${def.see[1]}</button><button class="btn btn-ghost" data-act="imp-reset">Importar otra planilla</button></div></div></div>${hist}`}
    const wrong=S.imp.loaded&&S.imp.sample==='wrong';
    const rows=S.imp.loaded&&!wrong?importRows(def):[];
    const nOk=rows.filter(x=>!x.err).length,nBad=rows.length-nOk;
    const missing=def.cols.filter(c=>!WRONG_COLS.includes(c)),extra=WRONG_COLS.filter(c=>!def.cols.includes(c));
    return `
    <div class="page-head"><div><h1>Importar desde Excel</h1><p class="muted">Trae la información que ya tienen en planillas para trabajar en un solo lugar. Nada se guarda hasta que revises la vista previa y confirmes.</p></div></div>
    <section class="stack"><h2 class="sec-title" style="font-size:1.3rem">1. ¿Qué quieres importar?</h2>
      <div class="opts">${Object.entries(IMPORTS).map(([key,d])=>`<label class="opt"><input type="radio" name="imp-kind" value="${key}" data-change="imp-kind" ${key===k?'checked':''}><span class="bub">${ic(key==='adopciones'?'heart':key==='animales'?'paw':key==='personas'?'users':'shield')}</span><span><b>${d.label}</b><small>${esc(d.desc)}</small></span></label>`).join('')}</div>
    </section>
    <section class="panel"><h2 style="font-size:1.3rem;font-weight:800">2. Completa la plantilla</h2>
      <p class="muted">La plantilla ya trae estas columnas, en este orden. Escribe las fechas como día-mes-año, por ejemplo 15-03-2024.</p>
      <div class="cols">${def.cols.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      <div><button class="btn btn-ghost btn-sm" data-act="imp-template">${ic('download')} Descargar plantilla de ${esc(def.label.toLowerCase())}</button></div>
      ${S.imp.tplNote?`<p class="note">${ic('info')} En este mockup no se descargan archivos. En la plataforma real se descarga <b>plantilla-${k}.xlsx</b>.</p>`:''}
    </section>
    <section class="panel"><h2 style="font-size:1.3rem;font-weight:800">3. Sube la planilla</h2>
      <label class="upload" for="imp-file"><span class="bub">${ic('upload')}</span><span><b>Elegir archivo</b><small>Excel (.xlsx, .xls) o .csv</small></span></label><input type="file" accept=".xlsx,.xls,.csv" id="imp-file" class="sr-only">
      <div class="row"><span class="small muted">Probar con una planilla de ejemplo:</span><button class="btn btn-ghost btn-sm" data-act="imp-sample" data-v="ok">Correcta</button><button class="btn btn-ghost btn-sm" data-act="imp-sample" data-v="errors">Con errores</button><button class="btn btn-ghost btn-sm" data-act="imp-sample" data-v="wrong">Plantilla equivocada</button></div>
      ${S.imp.fileNote&&S.imp.loaded?`<p class="note">${ic('info')} En este mockup cualquier archivo muestra la planilla de ejemplo con errores.</p>`:''}
    </section>
    ${wrong?`<section class="panel"><div class="panel-head"><div><h2 style="font-size:1.3rem">4. Revisa antes de importar</h2><p>${esc(S.imp.file)}</p></div></div>
      <div class="callout bad">${ic('x')}<span><b>Esta planilla no corresponde a la plantilla de ${esc(def.label.toLowerCase())}.</b> No se importará nada. Descarga la plantilla del paso 2 y copia ahí tus datos.</span></div>
      <div class="stack" style="gap:8px"><span class="small"><b>Faltan estas columnas:</b></span><div class="cols">${missing.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      ${extra.length?`<span class="small"><b>Sobran estas columnas:</b></span><div class="cols">${extra.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}</div>
      <div><button class="btn btn-ghost" data-act="imp-reset">Subir otra planilla</button></div>
    </section>`:''}
    ${S.imp.loaded&&!wrong?`<section class="panel"><div class="panel-head"><div><h2 style="font-size:1.3rem">4. Revisa antes de importar</h2><p>${esc(S.imp.file)}</p></div></div>
      ${nBad?`<div class="callout bad">${ic('x')}<span><b>${nBad} ${nBad===1?'fila tiene errores':'filas tienen errores'}. No se importará nada</b> hasta que todas las filas estén correctas. Corrige la planilla y súbela de nuevo.</span></div>`:`<span class="flag ok">${ic('check')} Las ${nOk} filas están correctas</span>`}
      <div class="ptable-wrap"><table class="ptable"><thead><tr><th>Fila</th>${def.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
        ${rows.map((x,i)=>`<tr class="${x.err?'bad':'ok'}"><td class="st">${i+2} ${x.err?'✕':'✓'}</td>${x.r.map((c,j)=>`<td>${esc(c)||'<span class="muted">—</span>'}${j===x.r.length-1&&x.err?'':''}</td>`).join('')}</tr>${x.err?`<tr class="bad"><td></td><td colspan="${def.cols.length}"><span class="msg">${esc(x.err)}</span></td></tr>`:''}`).join('')}
      </tbody></table></div>
      <div class="row"><button class="btn btn-primary" data-act="imp-run" ${nBad||!nOk?'disabled':''}>Importar ${rows.length} ${rows.length===1?'fila':'filas'}</button><button class="btn btn-ghost" data-act="imp-reset">Subir otra planilla</button></div>
    </section>`:''}
    ${hist}`;
  },
  respaldo(){
    if(!isAdmin())return `<div class="page-head"><div><h1>Respaldo</h1></div></div><div class="lock">${ic('lock')}<span>Solo la administración puede descargar los datos de la fundación.</span></div>`;
    const reqs=S.adoptReqs.length+S.memberReqs.length,rets=S.animals.reduce((n,a)=>n+a.returns.length,0);
    const sheets=[['Animales',S.animals.length,'Incluye adoptados y su estado'],['Devoluciones',rets,'Historial interno de cada animal'],['Personas',S.people.length,'Equipo, voluntarios, casas de acogida y socios'],['Solicitudes',reqs,'Adopción, socios y voluntarios'],['Restricciones',S.restrictions.length,'RUT, motivo y a qué especie aplica'],['Avisos',S.reports.length,'Avisos de animales en la calle']];
    return `
    <div class="page-head"><div><h1>Respaldos</h1><p class="muted">Descarga una copia de todos los datos de la fundación en un archivo que se abre con Excel. Sirve para guardarla en otro lugar, no para trabajar en ella: los cambios que hagas en el archivo no vuelven a la plataforma.</p></div></div>
    <div class="split">
      <section class="panel">
        <div class="panel-head"><div><h2>Qué incluye el archivo</h2><p>Una hoja por tipo de dato</p></div></div>
        <div class="list">${sheets.map(([n,c,d])=>`<div class="arow" style="grid-template-columns:52px 1fr auto"><span class="person-bub">${ic('sheet')}</span><div class="arow-main"><strong>${n}</strong><span class="small muted">${d}</span></div><span class="rut">${c} ${c===1?'fila':'filas'}</span></div>`).join('')}</div>
        <div class="callout warm">${ic('shield')}<span>El archivo contiene RUT y la lista de restricciones. Guárdalo en un lugar seguro y no lo compartas por WhatsApp ni por correo.</span></div>
        <button class="btn btn-primary" data-act="export">${ic('download')} Descargar respaldo en Excel</button>
        ${S.exportNote?`<p class="note">${ic('info')} En este mockup no se descargan archivos. En la plataforma real, este botón descarga <b>petscue-respaldo-2026-09-30.xlsx</b> y registra quién lo descargó.</p>`:''}
      </section>
      <section class="panel">
        <div class="panel-head"><div><h2>Respaldos automáticos</h2><p>Cada noche a las 03:00 se guarda una copia completa (datos y fotos) que se puede restaurar.</p></div></div>
        <span class="flag ok">${ic('check')} Último respaldo: hoy a las 03:00 · correcto</span>
        <form class="form" data-form="retention" novalidate>
          <label class="field"><span>¿Cuántos días guardar los respaldos?</span><select class="input" id="ret-days" name="days">${[7,14,30,60,90,180,365].map(d=>`<option value="${d}" ${S.org.retention===d?'selected':''}>${d} días${d===30?' (recomendado)':''}</option>`).join('')}</select><small>Los respaldos más antiguos se borran solos. Guardar más días usa más espacio en el servidor.</small></label>
          <button class="btn btn-primary btn-sm" type="submit" style="align-self:flex-start">Guardar</button>
        </form>
      </section>
      <section class="panel">
        <div class="panel-head"><div><h2>Descargas anteriores</h2><p>Queda registro de cada descarga</p></div></div>
        <div class="list">
          <div class="bl-row"><div><b>Marta González</b><br><span class="small muted">1 de septiembre de 2026 · 10:14</span></div></div>
          <div class="bl-row"><div><b>Marta González</b><br><span class="small muted">1 de agosto de 2026 · 09:52</span></div></div>
        </div>
      </section>
    </div>`;
  },
  mas(){
    return `<div class="page-head"><div><h1>Más</h1></div></div><div class="menu-list">
      <button class="way" data-go="importar"><span class="bub">${ic('upload')}</span><span><b>Importar desde Excel</b><small>Trae animales, adopciones, personas y restricciones</small></span><span class="arr">${ic('arrow')}</span></button>
      <button class="way" data-go="respaldo"><span class="bub">${ic('download')}</span><span><b>Respaldo en Excel</b><small>Descarga una copia de todos los datos</small></span><span class="arr">${ic('arrow')}</span></button>
      <button class="way" data-go="personas"><span class="bub">${ic('users')}</span><span><b>Personas</b><small>Equipo, voluntarios, socios y accesos</small></span><span class="arr">${ic('arrow')}</span></button>
      <button class="way" data-go="avisos"><span class="bub">${ic('alert')}</span><span><b>Avisos de la calle</b><small>${newReports()} sin atender</small></span><span class="arr">${ic('arrow')}</span></button>
      <button class="way" data-go="apariencia"><span class="bub">${ic('palette')}</span><span><b>Apariencia y datos</b><small>Logo, colores, tipografía y aportes</small></span><span class="arr">${ic('arrow')}</span></button>
      <button class="way" data-act="to-public"><span class="bub">${ic('eye')}</span><span><b>Ver la web pública</b><small>Cómo la ven las personas</small></span><span class="arr">${ic('arrow')}</span></button></div>`;
  }
};

/* ---------- Render ---------- */
function render(toTop){
  const app=$('#app'),pub=S.view==='public';
  const page=pub?PUB[S.pub.p]:ADM[S.adm.p];
  app.innerHTML=topbar()+(pub
    ?`<main class="main" id="main">${page()}</main>${footer()}${tabbar()}`
    :`<div class="admin-body">${sideNav()}<main class="main" id="main">${page()}</main></div>${tabbar()}`);
  document.querySelectorAll('.mk [data-mk]').forEach(b=>{const k=b.dataset.mk;b.setAttribute('aria-pressed',String((k==='view'&&S.view===b.dataset.v)||(k==='role'&&S.role===b.dataset.v)||(k==='theme'&&S.theme===b.dataset.v)||(k==='device'&&S.device===b.dataset.v)))});
  if(toTop){app.scrollTop=0;window.scrollTo(0,0)}
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.style.animation='none';t.offsetHeight;t.style.animation='';clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
function drawUnderline(root){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;root.querySelectorAll('.u path').forEach(p=>{p.style.transition='none';p.style.strokeDashoffset='260';p.getBoundingClientRect();p.style.transition='';p.style.strokeDashoffset='0'})}
function readFile(file,cb){const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsDataURL(file)}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const mk=e.target.closest('[data-mk]');
  if(mk){const k=mk.dataset.mk,v=mk.dataset.v;
    if(k==='view'){S.view=v;render(true)}
    if(k==='role'){S.role=v;S.rAdd=false;if(S.view!=='admin'){S.view='admin'}render()}
    if(k==='theme'){S.theme=v;applyTheme();render()}
    if(k==='device'){S.device=v;$('#stage').classList.toggle('phone',v==='phone');render()}
    return}
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();const p=g.dataset.go,id=g.dataset.id;S.returnOpen=false;S.exitOpen=false;S.draftPhoto=null;go(p,id?{id:id==='new'?'new':+id}:{});return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  switch(act){
    case 'back':S.returnOpen=false;S.draftPhoto=null;back();break;
    case 'big':S.big=!S.big;applyTheme();render();break;
    case 'to-public':S.view='public';S.pub={p:'inicio'};render(true);break;
    case 'f-species':S.filter.species=v;render();break;
    case 'f-reset':S.filter={species:'todos',size:'todos',age:'todos'};render();break;
    case 'help':{const ty=t.dataset.type;S.help={socio:ty!=='voluntario',voluntario:ty==='voluntario',mode:ty==='padrino'?'padrino':'aporte',amount:S.org.cuotas[1]||S.org.cuotas[0],animalId:id?+id:null};go('ayudar');break}
    case 'req-notify':{const r=S.adoptReqs.find(x=>x.id===+id),fp=fosterOf(animal(r.animalId));r.fosterNotified='hoy por correo';render();toast(`Se envió un correo a ${fp.name} con los datos de la solicitud`);break}
    case 'export':S.exportNote=true;render();break;
    case 'sp-toggle':{const s=spec(v);s.active=!s.active;if(!s.active&&S.filter.species===s.id)S.filter.species='todos';render();toast(s.active?`${s.plural} vuelven a mostrarse en la web`:`${s.plural} ya no aparecen en la web`);break}
    case 'imp-sample':S.imp.loaded=true;S.imp.sample=v;S.imp.fileNote=false;S.imp.file={ok:'planilla-correcta.xlsx',errors:'planilla-con-errores.xlsx',wrong:'contactos-2023.xlsx'}[v];S.imp.done=null;render();break;
    case 'imp-reset':S.imp.loaded=false;S.imp.done=null;render();break;
    case 'imp-template':S.imp.tplNote=true;render();break;
    case 'imp-run':runImport();break;
    case 'p-filter':S.pFilter=v;S.pConfirm=null;render();break;
    case 'p-revoke':S.pConfirm=+id;render();break;
    case 'p-revoke-no':S.pConfirm=null;render();break;
    case 'p-revoke-yes':{const p=person(id);p.access=null;S.pConfirm=null;render();toast(`${p.name} ya no puede entrar al panel`);break}
    case 'p-grant':{const p=person(id);p.access='trabajador';render();toast(`${p.name} puede entrar al panel como trabajador`);break}
    case 'p-foster':{const p=person(id);p.acogida=!p.acogida;render();toast(p.acogida?`${p.name} ahora es casa de acogida`:`${p.name} ya no es casa de acogida`);break}
    case 'share':{const a=animal(id),url=`https://fundacionpatitas.cl/animales/${a.name.toLowerCase()}`;
      try{navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado. Pégalo en WhatsApp o redes sociales.'),()=>toast(url))}catch(_){toast(url)}break}
    case 'report-photo-rm':S.report.photo=null;render();break;
    case 'chart':S.chartMode=v;render();break;
    case 'feature':{S.animals.forEach(a=>a.featured=false);const a=animal(id);a.featured=true;render();toast(`${a.name} ahora es el protagonista de la portada`);break}
    case 'adm-filter':S.admFilter=v;render();break;
    case 'exit-toggle':S.exitOpen=!S.exitOpen;render();break;
    case 'return-toggle':S.returnOpen=!S.returnOpen;render();break;
    case 'req-tab':S.reqTab=v;render();break;
    case 'req-interview':{const r=S.adoptReqs.find(x=>x.id===+id);r.status='entrevista';render();toast(`${r.name}: entrevista agendada`);break}
    case 'req-reject':{const r=S.adoptReqs.find(x=>x.id===+id);r.status='rechazada';render();break}
    case 'req-sign':{const r=S.adoptReqs.find(x=>x.id===+id),a=animal(r.animalId);r.status='firmada';a.status='adoptado';a.featured=false;a.foster=null;S.org.adoptions2026++;render();toast(`${a.name} fue adoptado. Ya no aparece en la web.`);break}
    case 'mem-ok':{const m=S.memberReqs.find(x=>x.id===+id);m.status='aprobada';if(m.socio)S.org.members++;
      S.people.push({id:Math.max(...S.people.map(p=>p.id))+1,name:m.name,body:m.body,since:'2026-09-29',staff:null,access:null,socio:m.socio,voluntario:m.voluntario,acogida:false});
      render();toast(`${m.name} ya aparece en Personas`);break}
    case 'mem-no':{const m=S.memberReqs.find(x=>x.id===+id);m.status='rechazada';render();break}
    case 'rut-try':S.rutQ=v;runRut(v);break;
    case 'r-toggle':S.rAdd=!S.rAdd;render();break;
    case 'r-rm':S.rConfirm=v;render();break;
    case 'r-rm-no':S.rConfirm=null;render();break;
    case 'r-rm-yes':S.restrictions=S.restrictions.filter(b=>b.body!==v);S.rConfirm=null;if(S.rutRes&&S.rutRes.body===v)S.rutRes=null;render();toast('Persona quitada de la lista');break;
    case 'report-done':{const r=S.reports.find(x=>x.id===+id);r.status='atendido';render();break}
    case 'preset':{const p=PRESETS.find(x=>x.name===v);S.org.brand=p.brand;S.org.accent=p.accent;applyTheme();render();break}
    case 'logo-rm':S.org.logo=null;render();break;
    case 'font-rm':S.org.font=null;S.org.fontName='';applyTheme();render();break;
  }
});
function runRut(q){const c=parseRut(q);S.rutRes=c.ok?{body:c.body,fmt:c.fmt,hit:restrictionFor(c.body)}:{invalid:c.msg};render()}
document.addEventListener('mouseover',e=>{const f=e.target.closest('.feature,.pv');if(f&&!f.dataset.drawn){f.dataset.drawn='1';drawUnderline(f)}});
document.addEventListener('mouseout',e=>{const f=e.target.closest('.feature,.pv');if(f&&!f.contains(e.relatedTarget))delete f.dataset.drawn});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.org){S.org[el.dataset.org]=el.value;document.querySelectorAll('.top .org b').forEach(n=>n.textContent=el.value||'Tu fundación');return}
  if(el.dataset.color){const k=el.dataset.color;S.org[k]=el.value;applyTheme();$(`#c-${k}-hex`).value=el.value.toUpperCase();$(`#cr-${k}`).innerHTML=crInfo(el.value);return}
  if(el.dataset.hex){const k=el.dataset.hex;let v=el.value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){S.org[k]=v;applyTheme();$(`#c-${k}`).value=v.toLowerCase();$(`#cr-${k}`).innerHTML=crInfo(v)}}
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.change;
  if(k==='f-size'){S.filter.size=el.value;render();return}
  if(k==='f-age'){S.filter.age=el.value;render();return}
  if(k==='help-socio'){S.help.socio=el.checked;keepHelpInputs();return}
  if(k==='help-vol'){S.help.voluntario=el.checked;keepHelpInputs();return}
  if(k==='help-mode'){S.help.mode=el.value;keepHelpInputs();return}
  if(k==='help-animal'){S.help.animalId=el.value?+el.value:null;keepHelpInputs();return}
  if(k==='imp-kind'){S.imp={kind:el.value,loaded:false,done:null};render();return}
  if(el.id==='imp-file'&&el.files&&el.files[0]){S.imp.loaded=true;S.imp.sample='errors';S.imp.file=el.files[0].name;S.imp.fileNote=true;S.imp.done=null;render();return}
  if(k==='an-status'){$('#foster-field').hidden=el.value!=='acogida';return}
  if(el.name==='amount'){S.help.amount=+el.value;return}
  if(el.dataset.color||el.dataset.hex){render();return}
  if(el.type==='file'&&el.files&&el.files[0]){
    const f=el.files[0];
    if(el.id==='org-font'){f.arrayBuffer().then(buf=>{const name='OrgFont'+Date.now();const ff=new FontFace(name,buf);return ff.load().then(l=>{document.fonts.add(l);S.org.font=name;S.org.fontName=f.name;applyTheme();render();toast('Tipografía aplicada a los títulos')})}).catch(()=>toast('No pudimos leer ese archivo de tipografía'));return}
    if(!f.type.startsWith('image/')){toast('Elige una imagen');return}
    readFile(f,url=>{
      if(el.id==='org-logo'){S.org.logo=url;render();toast('Logo actualizado')}
      else if(el.id==='an-photo'){S.draftPhoto=url;const keep=collectAnimalForm();render();restoreAnimalForm(keep)}
      else if(el.id==='rp-photo'){const keep={a:$('#rp-address').value,n:$('#rp-note').value,p:$('#rp-phone').value};S.report.photo=url;render();$('#rp-address').value=keep.a;$('#rp-note').value=keep.n;$('#rp-phone').value=keep.p}
    });
  }
});
function keepHelpInputs(){const ids=['h-name','h-rut','h-phone','h-email'],vals=ids.map(i=>$('#'+i)?.value||''),ok=$('#h-ok')?.checked;
  const av=[...document.querySelectorAll('input[name=avail]:checked')].map(x=>x.value);
  render();ids.forEach((i,n)=>{if($('#'+i))$('#'+i).value=vals[n]});if($('#h-ok'))$('#h-ok').checked=ok;
  document.querySelectorAll('input[name=avail]').forEach(x=>x.checked=av.includes(x.value))}
function collectAnimalForm(){const f=document.querySelector('[data-form="animal"]');const o={};f.querySelectorAll('input:not([type=file]),select,textarea').forEach(x=>o[x.id]=x.type==='checkbox'?x.checked:x.value);return o}
function restoreAnimalForm(o){Object.entries(o).forEach(([id,v])=>{const x=document.getElementById(id);if(!x)return;if(x.type==='checkbox')x.checked=v;else x.value=v});const s=$('#an-status');if(s)$('#foster-field').hidden=s.value!=='acogida'}
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,type=f.dataset.form,fd=Object.fromEntries(new FormData(f));
  const phoneOk=p=>(p||'').replace(/\D/g,'').length>=9;
  const fail=(id,msg)=>{const el=$('#'+id);el.textContent=msg;el.scrollIntoView({block:'center',behavior:'smooth'})};
  if(type==='rut'){S.rutQ=fd.q;runRut(fd.q);return}
  if(type==='adopt'){
    if(!fd.name.trim())return fail('ad-err','Escribe tu nombre y apellidos.');
    const c=parseRut(fd.rut);if(!c.ok)return fail('ad-err','Revisa el RUT. '+c.msg);
    if(!phoneOk(fd.phone))return fail('ad-err','Escribe un teléfono de al menos 9 números.');
    if(!fd.comuna.trim())return fail('ad-err','Escribe tu comuna.');
    const a=animal(f.dataset.id);
    S.adoptReqs.unshift({id:S.nextReq++,animalId:a.id,name:fd.name.trim(),body:c.body,phone:fd.phone.trim(),comuna:fd.comuna.trim(),home:fd.home,pets:fd.pets,when:'Ahora mismo',status:'nueva'});
    S.pubHist=[];S.pub={p:'gracias',kind:'adopt',name:a.name};render(true);return;
  }
  if(type==='help'){
    const h=S.help;
    if(!h.socio&&!h.voluntario)return fail('h-err','Elige si quieres ayudar como socio, como voluntario o ambos.');
    if(h.socio&&h.mode==='padrino'&&!h.animalId)return fail('h-err','Elige a qué animal quieres apadrinar.');
    if(!fd.name.trim())return fail('h-err','Escribe tu nombre y apellidos.');
    const c=parseRut(fd.rut);if(!c.ok)return fail('h-err','Revisa el RUT. '+c.msg);
    if(!phoneOk(fd.phone))return fail('h-err','Escribe un teléfono de al menos 9 números.');
    if(!fd.ok)return fail('h-err','Marca la casilla para que podamos guardar tus datos.');
    const socio=h.socio?(h.mode==='padrino'?{mode:'padrino',amount:animal(h.animalId).sponsor,animalId:h.animalId}:{mode:'aporte',amount:h.amount}):null;
    S.memberReqs.unshift({id:S.nextReq++,name:fd.name.trim(),body:c.body,socio,voluntario:h.voluntario,avail:new FormData(f).getAll('avail').join(', '),when:'Ahora mismo',status:'pendiente'});
    S.pubHist=[];S.pub={p:'gracias',kind:'help'};render(true);return;
  }
  if(type==='report'){
    if(!fd.address.trim())return fail('rp-err','Escribe dónde está el animal.');
    const code='AV-00'+(S.nextReport++);
    S.reports.unshift({id:Date.now(),code,when:'Ahora mismo',address:fd.address.trim(),note:fd.note.trim(),contact:fd.phone.trim()||'Anónimo',status:'nuevo',tone:3,photo:S.report.photo});
    S.report={photo:null};S.pubHist=[];S.pub={p:'gracias',kind:'report',code};render(true);return;
  }
  if(type==='restriction'){
    const c=parseRut(fd.rut);if(!c.ok)return fail('rs-err','Revisa el RUT. '+c.msg);
    if(restrictionFor(c.body))return fail('rs-err','Ese RUT ya está en la lista.');
    if(!fd.name.trim())return fail('rs-err','Escribe el nombre de la persona.');
    S.restrictions.unshift({body:c.body,name:fd.name.trim(),reason:fd.reason,species:fd.species,note:fd.note.trim()||'Sin notas.',date:'2026-09-28',by:'Marta González'});
    S.rAdd=false;render();toast('Añadido a la lista de restricciones');return;
  }
  if(type==='exit'){
    if(!fd.date)return fail('ex-err','Indica la fecha de la salida.');
    const a=animal(f.dataset.id);a.exit={kind:fd.kind,date:fd.date,notes:fd.notes.trim()};a.status=fd.kind;a.foster=null;a.featured=false;S.exitOpen=false;render();toast(`${a.name} ya no aparece en la web`);return;
  }
  if(type==='return'){
    if(!fd.reason.trim())return fail('ret-err','Cuéntanos brevemente por qué lo devolvieron.');
    const a=animal(f.dataset.id);a.returns.push({date:'2026-09-28',reason:fd.reason.trim()});a.status='disponible';S.returnOpen=false;render();toast(`${a.name} vuelve a estar disponible en la web`);return;
  }
  if(type==='animal'){
    if(!fd.name.trim())return fail('an-err','Ponle un nombre al animal.');
    const isNew=S.adm.id==='new';
    const a=isNew?{id:Math.max(...S.animals.map(x=>x.id))+1,tone:S.animals.length%TONES.length,visits:0,since:'2026-09-28',vacc:false,ster:false,chip:false,traits:['Recién llegado'],returns:[],ageGroup:'adulto'}:animal(S.adm.id);
    Object.assign(a,{name:fd.name.trim(),status:fd.status||a.status,species:fd.species,sex:fd.sex,age:fd.age.trim()||'Por confirmar',size:fd.size,sponsor:+fd.sponsor||0,quote:fd.quote.trim()||'Pronto contaremos más sobre este animal.',story:fd.story.trim()||'Pronto contaremos su historia.'});
    if(S.draftPhoto)a.photo=S.draftPhoto;
    a.foster=a.status==='acogida'&&fd.foster?{personId:+fd.foster}:null;
    if(fd.featured){S.animals.forEach(x=>x.featured=false);a.featured=true}else a.featured=false;
    if(isNew)S.animals.unshift(a);
    S.draftPhoto=null;S.admHist=[];S.adm={p:'animales'};render(true);toast(isNew?`${a.name} ya aparece en la web`:'Cambios guardados');return;
  }
  if(type==='species'){
    const name=fd.name.trim(),plural=fd.plural.trim();
    if(!name||!plural)return fail('sp-err','Escribe el nombre de la especie en singular y en plural.');
    if(specByName(name))return fail('sp-err','Esa especie ya existe.');
    S.species.push({id:name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\W+/g,'-'),name,plural,active:true});
    render();toast(`${plural} ya aparecen en la web`);return;
  }
  if(type==='retention'){S.org.retention=+fd.days;render();toast(`Los respaldos se guardarán ${fd.days} días`);return}
  if(type==='org'){
    S.org.fee=Math.max(0,+fd.fee||0);S.org.cuotas=[fd.c0,fd.c1,fd.c2].map(x=>Math.max(0,+x||0));
    S.org.address=fd.address.trim();S.org.phone=fd.phone.trim();S.org.email=fd.email.trim();
    SOCIAL.forEach(([k])=>S.org.social[k]=(fd['s_'+k]||'').trim().replace(/^@/,''));
    render();toast('Cambios guardados');
  }
});

applyTheme();
render();
</script>
